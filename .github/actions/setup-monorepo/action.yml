name: Setup monorepo
description: Instala Node.js y dependencias del monorepo Panel Waze

inputs:
  node-version:
    description: Versión de Node.js
    required: false
    default: "20"

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm

    - name: Install dependencies
      shell: bash
      run: npm ci --legacy-peer-deps
