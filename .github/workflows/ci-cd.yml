name: CI/CD Pipeline

on:
  push:
    branches: [main, preprod]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "20"

jobs:
  # =============================================
  # LINT & TYPE CHECK
  # =============================================
  lint:
    name: 🔍 Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build shared types (required by backend)
        working-directory: packages/types
        run: npm run build

      - name: Run ESLint (Frontend)
        working-directory: apps/frontend
        run: npx eslint . --max-warnings 50

      - name: TypeScript check (Frontend)
        working-directory: apps/frontend
        run: npx tsc --noEmit

      - name: TypeScript check (Backend)
        working-directory: apps/backend
        run: npx tsc --noEmit

  # =============================================
  # SECURITY AUDIT (paralelo con lint)
  # =============================================
  security:
    name: 🔒 Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run npm audit (root)
        run: npm audit --audit-level=high || true

      - name: Run npm audit (backend)
        working-directory: apps/backend
        run: npm audit --audit-level=high || true

      - name: Run npm audit (frontend)
        working-directory: apps/frontend
        run: npm audit --audit-level=high || true

  # =============================================
  # BUILD FRONTEND
  # =============================================
  build-frontend:
    name: 🏗️ Build Frontend
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build frontend
        working-directory: apps/frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || '/api' }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: apps/frontend/dist/
          retention-days: 7

  # =============================================
  # BUILD BACKEND
  # =============================================
  build-backend:
    name: 🔧 Build Backend
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build shared types
        working-directory: packages/types
        run: npm run build

      - name: Build backend
        working-directory: apps/backend
        run: npm run build

      - name: Upload backend build
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: apps/backend/dist/
          retention-days: 7

  # =============================================
  # UNIT TESTS
  # =============================================
  test-unit:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run unit tests
        run: npm run test --if-present

  # =============================================
  # TESTS E2E (Playwright) — no bloquea deploy
  # Requiere backend; usa mocks parciales en los tests.
  # =============================================
  test-e2e:
    name: 🎭 E2E Tests
    runs-on: ubuntu-latest
    needs: [build-frontend, build-backend]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Playwright browsers
        working-directory: apps/frontend
        run: npx playwright install --with-deps chromium

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: apps/frontend/dist/

      - name: Run E2E tests
        working-directory: apps/frontend
        run: npx playwright test --reporter=list
        env:
          CI: true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/frontend/playwright-report/
          retention-days: 30

  # =============================================
  # DEPLOY (Production) — Windows nativo + NSSM (10.1.0.136)
  # Sin Docker ni PM2. Servicios:
  #   PanelWazeBackend  → node dist\server.js  (:3002)
  #   PanelWazeNginx    → C:\nginx\nginx.exe   (:80, trafico principal)
  #   PanelWazeFrontend → serve -s dist        (:5180, preview opcional)
  # PostgreSQL local. Polling Waze dentro del backend (sin worker aparte).
  # =============================================
  deploy:
    name: 🚀 Deploy to Production
    runs-on: [self-hosted, Windows, panel-waze]
    needs: [build-frontend, build-backend, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    defaults:
      run:
        shell: powershell
    permissions:
      contents: read
    steps:
      - name: Deploy (NSSM update)
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $InstallDir = $env:DEPLOY_PATH
          if (-not $InstallDir) { $InstallDir = "D:\Aplicaciones CASISA\Panel-Ejecutivo-Pol-gonos-Waze-Monitoreados" }

          Write-Host "================================================"
          Write-Host " Deploy Panel Waze -> $InstallDir"
          Write-Host " SHA: $env:GITHUB_SHA"
          Write-Host "================================================"

          if (-not (Test-Path "$InstallDir\deploy\manage-services.ps1")) {
            throw "No se encontro manage-services.ps1 en $InstallDir\deploy"
          }

          $b64 = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$env:GH_TOKEN"))
          $env:GIT_CONFIG_COUNT = "1"
          $env:GIT_CONFIG_KEY_0 = "http.https://github.com/.extraheader"
          $env:GIT_CONFIG_VALUE_0 = "AUTHORIZATION: basic $b64"

          try {
            & "$InstallDir\deploy\manage-services.ps1" -Action update -InstallDir $InstallDir
            if ($LASTEXITCODE -ne 0) { throw "manage-services.ps1 update fallo: $LASTEXITCODE" }

            & "$InstallDir\deploy\manage-services.ps1" -Action status -InstallDir $InstallDir
            $global:LASTEXITCODE = 0
            Write-Host "[OK] Deploy completado: $env:GITHUB_SHA"
          } finally {
            Remove-Item Env:GIT_CONFIG_COUNT -ErrorAction SilentlyContinue
            Remove-Item Env:GIT_CONFIG_KEY_0 -ErrorAction SilentlyContinue
            Remove-Item Env:GIT_CONFIG_VALUE_0 -ErrorAction SilentlyContinue
          }

      - name: Verify deployment health
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          # Backend directo (NSSM PanelWazeBackend)
          Write-Host "Verificando backend NSSM en http://localhost:3002/health"
          for ($i = 1; $i -le 10; $i++) {
            try {
              $backend = Invoke-RestMethod -Uri "http://localhost:3002/health" -TimeoutSec 5
              Write-Host "[OK] Backend :3002 responde (uptime: $($backend.uptimeFormatted))"
              break
            } catch {
              if ($i -eq 10) { throw "Backend NSSM no responde en :3002 tras 10 intentos" }
              Write-Host "Esperando backend... intento $i/10"
              Start-Sleep -Seconds 15
            }
          }

          # Proxy nginx :80 (trafico principal)
          $base = if ([string]::IsNullOrWhiteSpace($env:PRODUCTION_URL)) { "http://localhost" } else { $env:PRODUCTION_URL.TrimEnd('/') }
          $url = "$base/health"
          Write-Host "Verificando nginx proxy en $url"
          for ($i = 1; $i -le 10; $i++) {
            try {
              $r = Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 5
              if ($r.StatusCode -eq 200) {
                Write-Host "[OK] Nginx proxy OK (intento $i)"
                exit 0
              }
            } catch {
              Write-Host "Esperando nginx... intento $i/10 (error: $($_.Exception.Message))"
            }
            Start-Sleep -Seconds 15
          }
          throw "Health check nginx fallo despues de 10 intentos"

  # =============================================
  # RESUMEN — jobs críticos deben pasar
  # E2E es informativo; deploy NSSM es obligatorio en main
  # =============================================
  pipeline-status:
    name: ✅ Pipeline Status
    runs-on: ubuntu-latest
    needs:
      - lint
      - security
      - build-frontend
      - build-backend
      - test-unit
      - test-e2e
      - deploy
    if: always()
    steps:
      - name: Verificar jobs críticos
        run: |
          check() {
            local name="$1"
            local result="$2"
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "❌ Job crítico falló: $name ($result)"
              exit 1
            fi
            echo "✅ $name: $result"
          }

          check "lint" "${{ needs.lint.result }}"
          check "security" "${{ needs.security.result }}"
          check "build-frontend" "${{ needs.build-frontend.result }}"
          check "build-backend" "${{ needs.build-backend.result }}"
          check "test-unit" "${{ needs.test-unit.result }}"

          # En push a main, deploy NSSM es obligatorio (sin Docker)
          if [ "${{ github.ref }}" = "refs/heads/main" ] && [ "${{ github.event_name }}" = "push" ]; then
            check "deploy" "${{ needs.deploy.result }}"
          fi

          # E2E es informativo — no bloquea
          e2e_result="${{ needs.test-e2e.result }}"
          if [ "$e2e_result" = "skipped" ]; then
            echo "⏭️  test-e2e: skipped"
          elif [ "$e2e_result" = "failure" ]; then
            echo "⚠️  test-e2e: failure (no bloquea pipeline)"
          else
            echo "✅ test-e2e: $e2e_result"
          fi
