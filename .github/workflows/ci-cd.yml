name: CI/CD Pipeline

on:
  push:
    branches: [main, preprod]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  # Solo cancelar runs en push (no en workflow_dispatch, para poder probar deploys
  # manualmente sin que se cancelen entre si).
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: read

env:
  NODE_VERSION: "20"

jobs:
  # =============================================
  # LINT & TYPE CHECK
  # =============================================
  lint:
    name: 🔍 Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build shared types (required by backend)
        working-directory: packages/types
        run: npm run build

      - name: Run ESLint (Frontend)
        working-directory: apps/frontend
        run: npx eslint . --max-warnings 50

      - name: TypeScript check (Frontend)
        working-directory: apps/frontend
        run: npx tsc --noEmit

      - name: TypeScript check (Backend)
        working-directory: apps/backend
        run: npx tsc --noEmit

  # =============================================
  # SECURITY AUDIT (paralelo con lint)
  # =============================================
  security:
    name: 🔒 Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run npm audit (root)
        run: npm audit --audit-level=high || true

      - name: Run npm audit (backend)
        working-directory: apps/backend
        run: npm audit --audit-level=high || true

      - name: Run npm audit (frontend)
        working-directory: apps/frontend
        run: npm audit --audit-level=high || true

  # =============================================
  # BUILD FRONTEND
  # =============================================
  build-frontend:
    name: 🏗️ Build Frontend
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build frontend
        working-directory: apps/frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || '/api' }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: apps/frontend/dist/
          retention-days: 7

  # =============================================
  # BUILD BACKEND
  # =============================================
  build-backend:
    name: 🔧 Build Backend
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build shared types
        working-directory: packages/types
        run: npm run build

      - name: Build backend
        working-directory: apps/backend
        run: npm run build

      - name: Upload backend build
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: apps/backend/dist/
          retention-days: 7

  # =============================================
  # UNIT TESTS
  # =============================================
  test-unit:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run unit tests
        run: |
          npm run test --workspace=apps/frontend
          npm run test --workspace=apps/backend

  # =============================================
  # TESTS E2E (Playwright) — /mapa + /siniestros/heatmap (mocks API, sin backend real)
  # =============================================
  test-e2e:
    name: 🎭 E2E Tests
    runs-on: ubuntu-latest
    needs: [build-frontend, build-backend]
    steps:
      - uses: actions/checkout@v4

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Playwright browsers
        working-directory: apps/frontend
        run: npx playwright install --with-deps chromium

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: apps/frontend/dist/

      - name: Run E2E tests
        working-directory: apps/frontend
        run: npx playwright test --reporter=list
        env:
          CI: true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/frontend/playwright-report/
          retention-days: 30

  # =============================================
  # DEPLOY (Production) — Windows nativo + NSSM (10.1.0.136)
  # Sin Docker ni PM2. Servicios:
  #   PanelWazeBackend  → node dist\server.js  (:3002)
  #   PanelWazeNginx    → C:\nginx\nginx.exe   (:80, trafico principal)
  #   PanelWazeFrontend → serve -s dist        (:5180, preview opcional)
  # PostgreSQL local. Polling Waze dentro del backend (sin worker aparte).
  # =============================================
  deploy:
    name: 🚀 Deploy to Production
    runs-on: [self-hosted, Windows, panel-waze]
    needs: [build-frontend, build-backend, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    defaults:
      run:
        shell: powershell
    permissions:
      contents: read
    steps:
      # Deploy atomico con health-check autoritativo y ROLLBACK automatico:
      # si build/arranque/health fallan, se vuelve al SHA previo (last-good)
      # y se re-despliega, dejando produccion siempre arriba. El job igual
      # termina en fallo para visibilizar el problema en el pipeline.
      - name: Deploy + health + rollback (NSSM)
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOY_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Continue (no Stop): comandos nativos (git/nssm/net/npm) escriben en
          # stderr y devuelven exit codes != 0 en casos normales; bajo Stop eso
          # se volvia excepcion y tumbaba el deploy. Validamos por $LASTEXITCODE
          # explicito; los `throw` siguen siendo terminantes y se capturan abajo.
          $ErrorActionPreference = "Continue"
          $InstallDir = $env:DEPLOY_PATH
          if (-not $InstallDir) { $InstallDir = "D:\Aplicaciones CASISA\Panel-Ejecutivo-Pol-gonos-Waze-Monitoreados" }
          $manage = "$InstallDir\deploy\manage-services.ps1"
          $prevSha = $null
          $deployedSha = $null
          $healthOk = $false
          $rolledBack = $false
          $deployOutcome = "pending"

          function Write-DeploySummary {
            $healthLabel = if ($script:healthOk) { "OK" } else { "FAIL" }
            $rollbackLabel = if ($script:rolledBack) { "Si" } else { "No" }
            $prev = if ($script:prevSha) { $script:prevSha } else { "n/a" }
            $dep = if ($script:deployedSha) { $script:deployedSha } else { $env:GITHUB_SHA }
            $lines = @(
              "## Deploy NSSM (production)",
              "",
              "| Campo | Valor |",
              "|-------|-------|",
              "| Outcome | $($script:deployOutcome) |",
              "| SHA previo (rollback) | ``$prev`` |",
              "| SHA desplegado | ``$dep`` |",
              "| Health backend+nginx | $healthLabel |",
              "| Rollback aplicado | $rollbackLabel |",
              "| InstallDir | ``$InstallDir`` |",
              "",
              "Estado de servicios: ``deploy\manage-services.ps1 -Action status``",
              "",
              "Seguimiento: ``deploy\check-deploy-status.ps1`` o docs en ``deploy\INSTRUCCIONES-DESPLIEGUE.md``."
            )
            $lines -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }

          Write-Host "================================================"
          Write-Host " Deploy Panel Waze -> $InstallDir"
          Write-Host " SHA: $env:GITHUB_SHA"
          Write-Host "================================================"

          if (-not (Test-Path $manage)) {
            $deployOutcome = "error"
            throw "No se encontro manage-services.ps1 en $InstallDir\deploy"
          }

          # Health autoritativo: backend :3002 (JSON real) + nginx :80 (proxy).
          function Test-DeployHealth {
            $backendOk = $false
            for ($i = 1; $i -le 20; $i++) {
              try {
                $b = Invoke-RestMethod -Uri "http://localhost:3002/health" -TimeoutSec 5
                if ($b) { Write-Host "[health] backend :3002 OK (uptime: $($b.uptimeFormatted))"; $backendOk = $true; break }
              } catch {
                Write-Host "[health] backend intento $i/20..."
                Start-Sleep -Seconds 6
              }
            }
            if (-not $backendOk) { Write-Host "[health] backend NO responde"; return $false }

            for ($i = 1; $i -le 10; $i++) {
              try {
                $r = Invoke-WebRequest -Uri "http://localhost/health" -UseBasicParsing -TimeoutSec 5
                if ($r.StatusCode -eq 200) { Write-Host "[health] nginx :80 OK"; return $true }
              } catch {
                Write-Host "[health] nginx intento $i/10..."
                Start-Sleep -Seconds 6
              }
            }
            Write-Host "[health] nginx NO responde"
            return $false
          }

          $b64 = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$env:GH_TOKEN"))
          $env:GIT_CONFIG_COUNT = "1"
          $env:GIT_CONFIG_KEY_0 = "http.https://github.com/.extraheader"
          $env:GIT_CONFIG_VALUE_0 = "AUTHORIZATION: basic $b64"
          $env:SKIP_GIT_SYNC = "1"

          try {
            $safeDir = ($InstallDir -replace '\\', '/')
            git config --global --add safe.directory $safeDir
            if ($LASTEXITCODE -ne 0) { throw "git config safe.directory fallo" }

            Push-Location $InstallDir
            try {
              git fetch origin main
              if ($LASTEXITCODE -ne 0) { throw "git fetch fallo (exit $LASTEXITCODE)" }

              # SHA actualmente desplegado = objetivo de rollback (last-good).
              $prevSha = (git rev-parse HEAD).Trim()
              Write-Host "SHA previo (rollback target): $prevSha"

              $target = if ($env:DEPLOY_SHA) { $env:DEPLOY_SHA.Trim() } else { "origin/main" }
              git checkout -f main
              if ($LASTEXITCODE -ne 0) { throw "git checkout main fallo (exit $LASTEXITCODE)" }
              git reset --hard $target
              if ($LASTEXITCODE -ne 0) { throw "git reset fallo (exit $LASTEXITCODE)" }
              $deployedSha = (git rev-parse HEAD).Trim()
              Write-Host "HEAD nuevo: $(git rev-parse --short HEAD)"
            } finally {
              Pop-Location
            }

            try {
              & $manage -Action update -InstallDir $InstallDir
              if ($LASTEXITCODE -ne 0) { throw "manage-services update fallo (exit $LASTEXITCODE)" }
              if (-not (Test-DeployHealth)) { throw "health-check fallo tras desplegar $target" }
              $healthOk = $true
              $deployOutcome = "success"
              $global:LASTEXITCODE = 0
              Write-Host "[OK] Deploy completado y saludable: $env:GITHUB_SHA"
            } catch {
              $deployErr = $_.Exception.Message
              $deployOutcome = "failed"
              Write-Host "##[error] Deploy fallo: $deployErr" -ForegroundColor Red
              if ($prevSha) {
                $rolledBack = $true
                Write-Host "[ROLLBACK] Volviendo a last-good $prevSha..."
                Push-Location $InstallDir
                try { git reset --hard $prevSha } finally { Pop-Location }
                & $manage -Action update -InstallDir $InstallDir
                if (Test-DeployHealth) {
                  $healthOk = $true
                  $deployedSha = $prevSha
                  Write-Host "[ROLLBACK] Produccion restaurada en $prevSha (saludable)"
                } else {
                  $healthOk = $false
                  Write-Host "##[error] ROLLBACK no saludable: intervencion manual requerida"
                }
              } else {
                Write-Host "##[error] Sin SHA previo: no se pudo hacer rollback"
              }
              throw "Deploy fallo y se aplico rollback a $prevSha. Causa: $deployErr"
            }
          } finally {
            Write-DeploySummary
            Remove-Item Env:SKIP_GIT_SYNC -ErrorAction SilentlyContinue
            Remove-Item Env:GIT_CONFIG_COUNT -ErrorAction SilentlyContinue
            Remove-Item Env:GIT_CONFIG_KEY_0 -ErrorAction SilentlyContinue
            Remove-Item Env:GIT_CONFIG_VALUE_0 -ErrorAction SilentlyContinue
          }

      - name: Estado final de servicios
        if: always()
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          $InstallDir = $env:DEPLOY_PATH
          if (-not $InstallDir) { $InstallDir = "D:\Aplicaciones CASISA\Panel-Ejecutivo-Pol-gonos-Waze-Monitoreados" }
          & "$InstallDir\deploy\manage-services.ps1" -Action status -InstallDir $InstallDir
          $global:LASTEXITCODE = 0

  # =============================================
  # RESUMEN — jobs críticos deben pasar
  # E2E obligatorio; deploy NSSM es obligatorio en main
  # =============================================
  pipeline-status:
    name: ✅ Pipeline Status
    runs-on: ubuntu-latest
    needs:
      - lint
      - security
      - build-frontend
      - build-backend
      - test-unit
      - test-e2e
      - deploy
    if: always()
    steps:
      - name: Verificar jobs críticos + Job Summary
        env:
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
          LINT: ${{ needs.lint.result }}
          SECURITY: ${{ needs.security.result }}
          BUILD_FE: ${{ needs.build-frontend.result }}
          BUILD_BE: ${{ needs.build-backend.result }}
          UNIT: ${{ needs.test-unit.result }}
          E2E: ${{ needs.test-e2e.result }}
          DEPLOY: ${{ needs.deploy.result }}
        run: |
          {
            echo "## Pipeline Status"
            echo ""
            echo "| Job | Resultado |"
            echo "|-----|----------|"
            echo "| lint | ${LINT} |"
            echo "| security | ${SECURITY} |"
            echo "| build-frontend | ${BUILD_FE} |"
            echo "| build-backend | ${BUILD_BE} |"
            echo "| test-unit | ${UNIT} |"
            echo "| test-e2e | ${E2E} |"
            echo "| deploy | ${DEPLOY} |"
            echo ""
            echo "- **ref:** \`${REF_NAME}\`"
            echo "- **sha:** \`${HEAD_SHA}\`"
            echo "- **event:** \`${EVENT_NAME}\`"
            if [ "${REF_NAME}" = "main" ] && [ "${EVENT_NAME}" = "push" ]; then
              echo "- **deploy NSSM:** aplicable (production)"
            elif [ "${REF_NAME}" = "preprod" ]; then
              echo "- **deploy NSSM:** no aplica (solo CI de staging)"
              echo ""
              echo "> Staging CI OK si los jobs criticos pasan — sin deploy NSSM. Listo para merge a main tras smoke manual."
            else
              echo "- **deploy NSSM:** no aplica"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          check() {
            local name="$1"
            local result="$2"
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "❌ Job crítico falló: $name ($result)"
              exit 1
            fi
            echo "✅ $name: $result"
          }

          check "lint" "${LINT}"
          check "security" "${SECURITY}"
          check "build-frontend" "${BUILD_FE}"
          check "build-backend" "${BUILD_BE}"
          check "test-unit" "${UNIT}"

          # En push a main, deploy NSSM es obligatorio (sin Docker)
          if [ "${REF_NAME}" = "main" ] && [ "${EVENT_NAME}" = "push" ]; then
            check "deploy" "${DEPLOY}"
          fi

          # E2E debe pasar; fallos indican regresión en /mapa, heatmap o mocks
          e2e_result="${E2E}"
          if [ "$e2e_result" = "skipped" ]; then
            echo "⏭️  test-e2e: skipped"
          elif [ "$e2e_result" != "success" ]; then
            echo "❌ test-e2e: $e2e_result"
            exit 1
          else
            echo "✅ test-e2e: success"
          fi
