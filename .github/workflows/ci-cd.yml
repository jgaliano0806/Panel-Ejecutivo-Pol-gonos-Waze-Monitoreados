name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "20"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # =============================================
  # LINT & TYPE CHECK
  # =============================================
  lint:
    name: 🔍 Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build shared types (required by backend)
        working-directory: packages/types
        run: npm run build

      - name: Run ESLint (Frontend)
        working-directory: apps/frontend
        run: npx eslint . --max-warnings 50

      - name: TypeScript check (Frontend)
        working-directory: apps/frontend
        run: npx tsc --noEmit

      - name: TypeScript check (Backend)
        working-directory: apps/backend
        run: npx tsc --noEmit

  # =============================================
  # SECURITY AUDIT (paralelo con lint)
  # =============================================
  security:
    name: 🔒 Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run npm audit (root)
        run: npm audit --audit-level=high || true

      - name: Run npm audit (backend)
        working-directory: apps/backend
        run: npm audit --audit-level=high || true

      - name: Run npm audit (frontend)
        working-directory: apps/frontend
        run: npm audit --audit-level=high || true

  # =============================================
  # BUILD FRONTEND
  # =============================================
  build-frontend:
    name: 🏗️ Build Frontend
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build frontend
        working-directory: apps/frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || '/api' }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: apps/frontend/dist/
          retention-days: 7

  # =============================================
  # BUILD BACKEND
  # =============================================
  build-backend:
    name: 🔧 Build Backend
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build shared types
        working-directory: packages/types
        run: npm run build

      - name: Build backend
        working-directory: apps/backend
        run: npm run build

      - name: Upload backend build
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: apps/backend/dist/
          retention-days: 7

  # =============================================
  # UNIT TESTS
  # =============================================
  test-unit:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run unit tests
        run: npm run test --if-present

  # =============================================
  # TESTS E2E (Playwright) — no bloquea Docker
  # =============================================
  test-e2e:
    name: 🎭 E2E Tests
    runs-on: ubuntu-latest
    needs: [build-frontend, build-backend]
    # E2E requiere backend+DB corriendo; no bloquea el pipeline
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright browsers
        working-directory: apps/frontend
        run: npx playwright install --with-deps chromium

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: apps/frontend/dist/

      - name: Run E2E tests
        working-directory: apps/frontend
        run: npx playwright test --reporter=list
        env:
          CI: true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/frontend/playwright-report/
          retention-days: 30

  # =============================================
  # DOCKER BUILD & PUSH
  # Solo se ejecuta en push a main (no en PRs)
  # No depende de E2E (requiere infraestructura externa)
  # =============================================
  docker:
    name: 🐳 Docker Build & Push
    runs-on: ubuntu-latest
    needs: [build-frontend, build-backend, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL || '/api' }}

  # =============================================
  # DEPLOY (Production) — Self-hosted runner on-prem (Windows + NSSM)
  # El runner corre DENTRO de la VPN corporativa (VM 10.1.0.136),
  # por lo que no necesita SSH ni exposicion publica del servidor.
  # Ejecuta: deploy/manage-services.ps1 -Action update
  # Labels requeridos en el runner: self-hosted, Windows, panel-waze
  # =============================================
  deploy:
    name: 🚀 Deploy to Production
    runs-on: [self-hosted, Windows, panel-waze]
    needs: [build-frontend, build-backend, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    defaults:
      run:
        shell: powershell
    permissions:
      contents: read
    steps:
      - name: Deploy (NSSM update)
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $InstallDir = $env:DEPLOY_PATH
          if (-not $InstallDir) { $InstallDir = "D:\Aplicaciones CASISA\Panel-Ejecutivo-Pol-gonos-Waze-Monitoreados" }

          Write-Host "================================================"
          Write-Host " Deploy Panel Waze -> $InstallDir"
          Write-Host " SHA: $env:GITHUB_SHA"
          Write-Host "================================================"

          if (-not (Test-Path "$InstallDir\deploy\manage-services.ps1")) {
            throw "No se encontro manage-services.ps1 en $InstallDir\deploy"
          }

          # Inyectar token efimero para autenticar 'git pull' en repo privado
          # (runner corre como LocalSystem). Usamos env vars de git-config en lugar de
          # 'git config --local' para evitar issues con paths unicode en Windows
          # (el InstallDir contiene tildes). Las env vars se heredan al 'cmd /c git pull'
          # que hace manage-services.ps1 y se pierden al terminar el step.
          $b64 = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$env:GH_TOKEN"))
          $env:GIT_CONFIG_COUNT = "1"
          $env:GIT_CONFIG_KEY_0 = "http.https://github.com/.extraheader"
          $env:GIT_CONFIG_VALUE_0 = "AUTHORIZATION: basic $b64"

          try {
            & "$InstallDir\deploy\manage-services.ps1" -Action update -InstallDir $InstallDir
            if ($LASTEXITCODE -ne 0) { throw "manage-services.ps1 update fallo: $LASTEXITCODE" }

            & "$InstallDir\deploy\manage-services.ps1" -Action status -InstallDir $InstallDir
            $global:LASTEXITCODE = 0
            Write-Host "[OK] Deploy completado: $env:GITHUB_SHA"
          } finally {
            Remove-Item Env:GIT_CONFIG_COUNT -ErrorAction SilentlyContinue
            Remove-Item Env:GIT_CONFIG_KEY_0 -ErrorAction SilentlyContinue
            Remove-Item Env:GIT_CONFIG_VALUE_0 -ErrorAction SilentlyContinue
          }

      - name: Verify deployment health
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          $base = if ([string]::IsNullOrWhiteSpace($env:PRODUCTION_URL)) { "http://localhost" } else { $env:PRODUCTION_URL.TrimEnd('/') }
          $url = "$base/health"
          Write-Host "Verificando health check en $url"
          for ($i = 1; $i -le 10; $i++) {
            try {
              $r = Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 5
              if ($r.StatusCode -eq 200) {
                Write-Host "[OK] Health check OK (intento $i)"
                exit 0
              }
            } catch {
              Write-Host "Esperando... intento $i/10 (error: $($_.Exception.Message))"
            }
            Start-Sleep -Seconds 15
          }
          throw "Health check fallo despues de 10 intentos"
