name: PR Checks

on:
  pull_request:
    branches: [main, preprod]

concurrency:
  group: pr-checks-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "20"

jobs:
  lint:
    name: 🔍 Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run ESLint (Frontend)
        working-directory: apps/frontend
        run: npx eslint . --max-warnings 50

  typecheck:
    name: 📝 TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build shared types (required by backend)
        working-directory: packages/types
        run: npm run build

      - name: TypeScript check (Frontend)
        working-directory: apps/frontend
        run: npx tsc --noEmit

      - name: TypeScript check (Backend)
        working-directory: apps/backend
        run: npx tsc --noEmit

  build:
    name: 🏗️ Build Check
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4

      - name: Setup monorepo
        uses: ./.github/actions/setup-monorepo
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build shared types
        working-directory: packages/types
        run: npm run build

      - name: Build frontend
        working-directory: apps/frontend
        run: npm run build
        env:
          VITE_API_URL: /api

      - name: Build backend
        working-directory: apps/backend
        run: npm run build

  pr-status:
    name: ✅ PR Status
    runs-on: ubuntu-latest
    needs: [lint, typecheck, build]
    if: always()
    steps:
      - name: Verificar checks de PR
        run: |
          for job in lint typecheck build; do
            case "$job" in
              lint) result="${{ needs.lint.result }}" ;;
              typecheck) result="${{ needs.typecheck.result }}" ;;
              build) result="${{ needs.build.result }}" ;;
            esac
            if [ "$result" != "success" ]; then
              echo "❌ $job: $result"
              exit 1
            fi
            echo "✅ $job: success"
          done
