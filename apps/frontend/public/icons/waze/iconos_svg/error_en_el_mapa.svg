<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Círculo de fondo -->
  <circle cx="100" cy="100" r="90" fill="#3d4a5c"/>
  
  <!-- Mapa plegado -->
  <g transform="translate(100, 100)">
    <!-- Sección izquierda del mapa -->
    <rect x="-35" y="-25" width="25" height="50" fill="#60a5fa" stroke="#3b82f6" stroke-width="2" rx="2"/>
    <!-- Líneas del mapa -->
    <line x1="-30" y1="-15" x2="-15" y2="-15" stroke="#1e3a8a" stroke-width="2"/>
    <line x1="-30" y1="-5" x2="-15" y2="-5" stroke="#1e3a8a" stroke-width="2"/>
    <line x1="-25" y1="5" x2="-20" y2="15" stroke="#1e3a8a" stroke-width="2"/>
    
    <!-- Sección central del mapa -->
    <rect x="-10" y="-25" width="25" height="50" fill="#93c5fd" stroke="#3b82f6" stroke-width="2" rx="2"/>
    <line x1="-5" y1="-10" x2="10" y2="-10" stroke="#1e3a8a" stroke-width="2"/>
    <line x1="-5" y1="0" x2="10" y2="0" stroke="#1e3a8a" stroke-width="2"/>
    
    <!-- Sección derecha del mapa -->
    <rect x="15" y="-25" width="25" height="50" fill="#60a5fa" stroke="#3b82f6" stroke-width="2" rx="2"/>
    <line x1="20" y1="-15" x2="35" y2="-15" stroke="#1e3a8a" stroke-width="2"/>
  </g>
  
  <!-- Símbolo de error (!) -->
  <g transform="translate(100, 100)">
    <circle cx="0" cy="0" r="15" fill="#ef4444"/>
    <rect x="-2.5" y="-8" width="5" height="12" fill="#ffffff" rx="1.5"/>
    <circle cx="0" cy="7" r="2.5" fill="#ffffff"/>
  </g>
</svg>
