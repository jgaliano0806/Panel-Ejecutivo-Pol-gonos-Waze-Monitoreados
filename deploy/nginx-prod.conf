worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;
    gzip_min_length 1000;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

    server {
        listen 80;
        server_name _;

        root INSTALL_DIR/apps/frontend/dist;
        index index.html;

        # API proxy
        location /api {
            limit_req zone=api burst=50 nodelay;

            proxy_pass http://127.0.0.1:3002;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 120s;
            proxy_connect_timeout 60s;
        }

        # WebSocket proxy (Socket.IO)
        location /socket.io/ {
            proxy_pass http://127.0.0.1:3002/socket.io/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Health check
        location /health {
            proxy_pass http://127.0.0.1:3002/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Tile proxy - OpenStreetMap
        location /tiles/osm/ {
            proxy_pass https://tile.openstreetmap.org/;
            proxy_set_header Host tile.openstreetmap.org;
            proxy_set_header Accept-Encoding "";
            proxy_cache_valid 200 7d;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        # Tile proxy - CARTO Dark (rastertiles/dark_all)
        location /tiles/carto-dark/ {
            proxy_pass https://a.basemaps.cartocdn.com/rastertiles/dark_all/;
            proxy_set_header Host a.basemaps.cartocdn.com;
            proxy_set_header Accept-Encoding "";
            proxy_cache_valid 200 7d;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        # Tile proxy - CARTO Light (rastertiles/light_all)
        location /tiles/carto-light/ {
            proxy_pass https://a.basemaps.cartocdn.com/rastertiles/light_all/;
            proxy_set_header Host a.basemaps.cartocdn.com;
            proxy_set_header Accept-Encoding "";
            proxy_cache_valid 200 7d;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        # Assets estaticos con cache largo
        location /assets {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # Archivos publicos del backend
        location /public/ {
            proxy_pass http://127.0.0.1:3002/public/;
            proxy_http_version 1.1;
        }

        # SPA fallback
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root html;
        }
    }
}
