version: "3.8"

services:
  # =============================================
  # DESARROLLO LOCAL
  # =============================================
  frontend-dev:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile.dev
      target: frontend-dev
    ports:
      - "5173:5173"
    volumes:
      - ./apps/frontend/src:/app/src
      - ./apps/frontend/public:/app/public
      - ./apps/frontend/index.html:/app/index.html
    environment:
      - VITE_API_URL=http://backend-dev:3001
      - VITE_GOOGLE_MAPS_API_KEY=${VITE_GOOGLE_MAPS_API_KEY}
    depends_on:
      - backend-dev
    profiles:
      - dev

  backend-dev:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile.dev
    ports:
      - "3001:3001"
    volumes:
      - ./apps/backend/src:/app/src
      - ./apps/backend/data:/app/data
    environment:
      - NODE_ENV=development
      - PORT=3001
      - FRONTEND_URL=http://localhost:5173
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=panel_waze
      - DB_USER=postgres
      - DB_PASSWORD=postgres
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - dev

  # =============================================
  # BASE DE DATOS POSTGRESQL
  # =============================================
  postgres:
    image: postgres:16-alpine
    container_name: panel-waze-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=panel_waze
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./apps/backend/src/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    profiles:
      - dev
      - prod

  # =============================================
  # REDIS CACHE
  # =============================================
  redis:
    image: redis:7-alpine
    container_name: panel-waze-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    profiles:
      - dev
      - prod

  # =============================================
  # PRODUCCIÓN
  # =============================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_GOOGLE_MAPS_API_KEY=${VITE_GOOGLE_MAPS_API_KEY}
        - VITE_API_URL=/api
    ports:
      - "80:80"
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=panel_waze
      - DB_USER=postgres
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
    volumes:
      - ./apps/backend/data:/app/backend/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3001/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    profiles:
      - prod

  # =============================================
  # MONITOREO (Opcional)
  # =============================================
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
    profiles:
      - monitoring

volumes:
  grafana-data:
  postgres-data:
  redis-data:

networks:
  default:
    name: panel-waze-network
