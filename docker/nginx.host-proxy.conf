# =============================================================
# NGINX — REVERSE PROXY DEL HOST (Windows Server / WSL2)
# Servidor: waze  10.1.0.136
#
# ARQUITECTURA:
#   Puerto 80 del host → este nginx → rutas a contenedores
#
#   /preprod/*  →  contenedor preprod-app  (host:8181)
#   /           →  contenedor prod-app     (host:8080)   ← prod debe
#                                                           cambiar su
#                                                           puerto a 8080
#
# CÓMO APLICAR EN WSL2 (Ubuntu):
#   1. sudo cp nginx.host-proxy.conf /etc/nginx/nginx.conf
#   2. sudo nginx -t && sudo nginx -s reload
#
# CÓMO APLICAR EN DOCKER (nginx como contenedor proxy):
#   Ver instrucciones al final del archivo.
#
# NOTA: Cambia el puerto de prod en docker-compose.yml:
#   ports: ["8080:80"]   (era "80:80")
# =============================================================

user nginx;
worker_processes auto;          # detecta vCPUs automáticamente (hasta 16)
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format proxy '$remote_addr [$time_local] "$request" '
                     '$status $body_bytes_sent '
                     'upstream="$upstream_addr" rt=$request_time '
                     '"$http_user_agent"';

    access_log /var/log/nginx/access.log proxy;

    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Tamaño para archivos KMZ / Excel de vialidad
    client_max_body_size 50M;
    client_body_timeout  60s;

    # Compresión (aunque los upstreams ya comprimirán, por si acaso)
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_types      text/plain text/css text/xml application/json
                    application/javascript application/xml+rss
                    image/svg+xml application/wasm;
    gzip_min_length 1000;

    # Seguridad
    server_tokens off;
    add_header X-Frame-Options        "SAMEORIGIN"                   always;
    add_header X-Content-Type-Options "nosniff"                      always;
    add_header X-XSS-Protection       "1; mode=block"               always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # Rate-limit global
    limit_req_zone  $binary_remote_addr zone=global:10m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=global_conn:10m;

    # -------------------------------------------------------
    # Upstream: contenedor PRODUCCIÓN  (host:8080 → container:80)
    # -------------------------------------------------------
    upstream prod_app {
        server 127.0.0.1:8080;
        keepalive 32;
    }

    # -------------------------------------------------------
    # Upstream: contenedor PRE-PRODUCCIÓN  (host:8181 → container:80)
    # -------------------------------------------------------
    upstream preprod_app {
        server 127.0.0.1:8181;
        keepalive 16;
    }

    # -------------------------------------------------------
    # Servidor principal: enruta tráfico según path
    # -------------------------------------------------------
    server {
        listen 80 default_server;
        server_name 10.1.0.136 _;

        # ---------------------------------------------------
        # /preprod  → redirect con trailing slash
        # ---------------------------------------------------
        location = /preprod {
            return 301 /preprod/;
        }

        # ---------------------------------------------------
        # /preprod/* → contenedor pre-producción
        # El contenedor ya conoce su base path (/preprod/),
        # se pasa tal cual sin reescribir el path.
        # ---------------------------------------------------
        location /preprod/ {
            limit_req  zone=global burst=30 nodelay;
            limit_conn zone=global_conn 20;

            proxy_pass         http://preprod_app;   # pasa /preprod/... completo
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Forwarded-Prefix /preprod;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout    120s;
            proxy_connect_timeout  10s;
            proxy_send_timeout     60s;

            # Buffer razonable para SSE / polling largo
            proxy_buffering    on;
            proxy_buffer_size  16k;
            proxy_buffers      4 64k;
        }

        # ---------------------------------------------------
        # /api/* → prod (ruta directa, igual que antes)
        # ---------------------------------------------------
        location /api {
            limit_req  zone=global burst=40 nodelay;
            limit_conn zone=global_conn 20;

            proxy_pass         http://prod_app;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout    60s;
            proxy_connect_timeout 10s;
        }

        # WebSocket producción
        location /socket.io/ {
            proxy_pass         http://prod_app;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_set_header   X-Real-IP  $remote_addr;
            proxy_read_timeout 3600s;
        }

        # ---------------------------------------------------
        # /* → contenedor producción (SPA + assets)
        # ---------------------------------------------------
        location / {
            limit_req  zone=global burst=40 nodelay;
            limit_conn zone=global_conn 30;

            proxy_pass         http://prod_app;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout    60s;
            proxy_connect_timeout 10s;

            proxy_buffering    on;
            proxy_buffer_size  16k;
            proxy_buffers      4 64k;
        }

        # Páginas de error
        error_page 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }
    }
}

# =============================================================
# USO COMO CONTENEDOR DOCKER (alternativa a instalar nginx en WSL2)
#
# Agregar este servicio al docker-compose.yml de producción:
#
# services:
#   nginx-proxy:
#     image: nginx:alpine
#     container_name: panel-waze-nginx-proxy
#     ports:
#       - "80:80"
#     volumes:
#       - ./docker/nginx.host-proxy.conf:/etc/nginx/nginx.conf:ro
#     extra_hosts:
#       - "host.docker.internal:host-gateway"
#     restart: unless-stopped
#     networks:
#       - default            # red de prod
#       - panel-waze-preprod-network  # red de pre-prod
#
# networks:
#   panel-waze-preprod-network:
#     external: true
#
# En ese caso reemplaza los upstreams por nombres de servicios Docker:
#   upstream prod_app    { server panel-waze-app:80; }
#   upstream preprod_app { server panel-waze-preprod-app:80; }
# =============================================================
