# =============================================================
# NGINX — CONFIGURACIÓN INTERNA DEL CONTENEDOR PRE-PRODUCCIÓN
#
# El frontend se compiló con base="/preprod/" (Vite), por lo que:
#   · index.html referencia  /preprod/assets/...
#   · React Router usa /preprod como basename
#
# Este nginx DENTRO del contenedor atiende el puerto 80 y sirve:
#   GET /preprod/          → SPA (alias a dist/)
#   GET /preprod/assets/*  → estáticos (caché larga)
#   GET /preprod/api/*     → proxy_pass al backend Node en :3001
#   GET /preprod/socket.io → proxy WebSocket al backend
#   GET /health            → health-check interno (no expuesto en /preprod/)
# =============================================================

user nginx;
worker_processes 2;          # pre-prod: 2 workers es suficiente
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 512;
    use epoll;
    multi_accept on;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format preprod '$remote_addr [$time_local] "$request" '
                       '$status $body_bytes_sent rt=$request_time '
                       '"$http_user_agent"';

    access_log /var/log/nginx/access.log preprod;

    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;
    keepalive_timeout 60;

    # Compresión
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 5;
    gzip_types      text/plain text/css text/xml application/json
                    application/javascript application/xml+rss
                    image/svg+xml application/wasm;
    gzip_min_length 1000;

    # Tamaño máximo para subida de archivos KMZ / Excel de vialidad
    client_max_body_size 50M;
    client_body_timeout  60s;

    # Headers de seguridad
    add_header X-Frame-Options       "SAMEORIGIN"                   always;
    add_header X-Content-Type-Options "nosniff"                     always;
    add_header X-XSS-Protection      "1; mode=block"               always;
    add_header Referrer-Policy       "strict-origin-when-cross-origin" always;
    # Identificador de ambiente para debugging
    add_header X-Environment         "pre-produccion"              always;

    # Rate-limit conservador para pre-prod
    limit_req_zone  $binary_remote_addr zone=preprod_api:5m  rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=preprod_conn:5m;

    upstream preprod_backend {
        server 127.0.0.1:3001;
        keepalive 16;
    }

    # -----------------------------------------------------------
    # Servidor principal
    # -----------------------------------------------------------
    server {
        listen 80;
        server_name _;

        # -------------------------------------------------------
        # Trailing-slash redirect: /preprod → /preprod/
        # Evita que los assets rompan por paths relativos.
        # -------------------------------------------------------
        location = /preprod {
            return 301 /preprod/;
        }

        # -------------------------------------------------------
        # SPA — sirve dist/ bajo el prefijo /preprod/
        # -------------------------------------------------------
        location /preprod/ {
            alias /app/frontend/dist/;

            # Cache-control para el HTML (no cachear en browser)
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma        "no-cache"                           always;
            add_header Expires       "0"                                  always;
            add_header X-Environment "pre-produccion"                    always;

            # SPA fallback: cualquier ruta desconocida → index.html
            try_files $uri $uri/ /preprod/index.html;

            index index.html;
        }

        # -------------------------------------------------------
        # Estáticos: caché larga (hash en nombre = immutable)
        # -------------------------------------------------------
        location /preprod/assets/ {
            alias /app/frontend/dist/assets/;
            expires 1y;
            add_header Cache-Control "public, immutable" always;
            add_header X-Environment "pre-produccion"   always;
            try_files $uri =404;
        }

        # -------------------------------------------------------
        # API REST → backend Node.js
        # Strip del prefijo /preprod antes de pasar al backend
        # -------------------------------------------------------
        location /preprod/api {
            limit_req  zone=preprod_api burst=15 nodelay;
            limit_conn zone=preprod_conn 8;

            # /preprod/api/algo  →  /api/algo
            rewrite ^/preprod(/api.*) $1 break;

            proxy_pass         http://preprod_backend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Forwarded-Prefix /preprod;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout    60s;
            proxy_connect_timeout 10s;
            proxy_send_timeout    60s;
        }

        # -------------------------------------------------------
        # WebSocket Socket.IO
        # -------------------------------------------------------
        location /preprod/socket.io/ {
            rewrite ^/preprod(/socket\.io/.*) $1 break;

            proxy_pass         http://preprod_backend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_set_header   X-Real-IP  $remote_addr;
            proxy_read_timeout 3600s;
        }

        # -------------------------------------------------------
        # Health-check interno (no requiere /preprod/)
        # -------------------------------------------------------
        location = /health {
            proxy_pass http://preprod_backend/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            access_log off;
        }

        # -------------------------------------------------------
        # Redirigir raíz al ambiente preprod (UX)
        # -------------------------------------------------------
        location = / {
            return 302 /preprod/;
        }

        # Páginas de error
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }
    }
}
